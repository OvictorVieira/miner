services:
  miner:
    image: ghcr.io/fullsystem/miner:latest
    build: .
    restart: unless-stopped
    # Non-root numeric UID/GID matches the `miner` user baked into the image.
    user: "10001:10001"
    # Immutable root filesystem — only the explicit tmpfs below is writable.
    read_only: true
    # Drop every Linux capability. The miner needs none.
    cap_drop:
      - ALL
    # Keep Docker's default seccomp profile active (never seccomp=unconfined)
    # and forbid gaining new privileges via setuid/setgid binaries.
    security_opt:
      - no-new-privileges:true
    # Do NOT enable privileged mode and do NOT share host namespaces.
    # These lines are intentionally commented so a reviewer sees them.
    # privileged: false            # (default — never set to true)
    # pid: host                    # (never)
    # ipc: host                    # (never)
    # network: host                # (never)
    # userns_mode: host            # (never)
    # No named volume and no host bind mount in the MVP — the container must
    # not reach outside its own filesystem. The one writable area is a
    # bounded tmpfs for libcurl / glibc scratch space.
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    ports:
      - "3500:3500"
    environment:
      # Your BTC wallet — the only required variable
      WALLET: ${WALLET:?Set WALLET in .env}
      # Percentage of CPU cores used by the miner (1-100)
      POWER: ${POWER:-50}
      # Worker name shown at the pool (useful with multiple instances)
      WORKER_NAME: ${WORKER_NAME:-miner}
      # Dashboard password; without it the panel is public read-only
      # DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    # Hard CPU cap for the whole container, on top of POWER — plays nice
    # with other projects on the same box:
    # cpus: "2.0"
